version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      github_actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # TypeScript is held on 6.0.x until typescript-eslint's peer range admits
      # a newer line. Every typescript-eslint release through 8.72.1 (npm
      # `latest` on 2026-11-06) declares peer typescript ">=4.8.4 <6.1.0", so a 6.1+/7.x
      # bump makes `npm ci` fail with ERESOLVE (see PR #62). Remove this entry
      # once a typescript-eslint release widens that range.
      - dependency-name: "typescript"
        versions: [">=6.1"]
      # No better-auth hold: src/lib/auth was migrated to the better-auth 1.7
      # social API in PR #74 and the lockfile is on 1.7.x. The former
      # `>=1.7` ignore made every 1.7.x update "all_versions_ignored", which
      # failed Dependabot's better-auth security-update job (update #1658444314).

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
