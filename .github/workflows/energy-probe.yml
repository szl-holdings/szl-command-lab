name: energy-probe

on:
  push:
    paths:
      - "space/energy.py"
      - "space/requirements.txt"
      - ".github/workflows/energy-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NVML bindings (no GPU expected on ubuntu-latest)
        run: pip install --no-cache-dir -r space/requirements.txt
      - name: Probe RAPL / NVML
        run: python3 space/energy.py | tee energy-probe.json
      - name: Honesty gate — never a fabricated joule
        run: |
          python3 - << 'PY'
          import json
          d = json.load(open("energy-probe.json"))
          p = d["probe"]
          assert p["channel"] == "LIVE"
          if p["honesty"] == "MEASURED":
              assert p["source"] in ("intel-rapl", "nvml")
              assert p.get("package_energy_j") is not None
          else:
              assert p["honesty"] == "UNAVAILABLE"
              assert p["energy_j"] is None
              assert p["inference_energy_j"] is None
          print("energy-probe", p["honesty"], p.get("source"), p.get("note"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-probe
          path: energy-probe.json
