name: SZL Public Experience v3 Contract

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  docker-readonly-demo-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned Python 3.14 runtime without publishing
        run: docker build --progress=plain -t szl-command-lab:pr .
      - name: Check local container routes and installed distributions
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run --rm -d -p 127.0.0.1:7869:7860 szl-command-lab:pr)"
          trap 'docker stop "$cid" > /dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7869/demos > /dev/null; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          from urllib.request import urlopen
          root = "http://127.0.0.1:7869"
          for path in ("/", "/launchpad", "/demos", "/demos/retrieval/inventory",
                       "/demos/receipts/intact", "/demos/receipts/tampered"):
              with urlopen(root + path, timeout=5) as response:
                  assert response.status == 200, path
                  assert response.read(), path
          with urlopen(root + "/api/demo-adapters", timeout=5) as response:
              registry = json.load(response)
          assert registry["authority"] == "NONE"
          assert [(row["distribution"], row["version"], row["state"]) for row in registry["adapters"]] == [
              ("szl-retrieval-bench", "0.3.1", "AVAILABLE"),
              ("szl-guardrail-receipt", "0.1.2", "AVAILABLE"),
          ]
          print("local container routes and pinned adapters: PASS")
          PY

  atlas-responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install isolated browser test dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Install pinned read-only demo distributions
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-public-demos.txt
      - name: Verify the shipped Atlas with synthetic provider data
        shell: bash
        run: |
          set -euo pipefail
          HOST=127.0.0.1 PORT=7868 python gateway.py > "$RUNNER_TEMP/atlas-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7868/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/atlas-browser/node_modules" \
            ATLAS_EVIDENCE_DIR="$RUNNER_TEMP/atlas-browser-evidence" \
            node --test scripts/atlas-responsive.test.cjs
          NODE_PATH="$RUNNER_TEMP/atlas-browser/node_modules" \
            ATLAS_EVIDENCE_DIR="$RUNNER_TEMP/atlas-browser-evidence" \
            node --test scripts/public-demos.test.cjs
      - name: Retain browser measurements and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-responsive-${{ github.sha }}
          path: |
            ${{ runner.temp }}/atlas-browser-evidence/
            ${{ runner.temp }}/atlas-preview.log
          if-no-files-found: error

  public-experience-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node for estate contract regressions
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify static and typed estate consumers
        run: node --test scripts/atlas-estate-ui.test.mjs scripts/atlas-estate-consumer.test.mjs
      - name: Verify local responsive assets and source binding
        shell: bash
        env:
          SZL_HOLO_ENTRYPOINT: "space/index.html"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import py_compile
          import subprocess

          raw_asset_paths = ["space/szl-holo-v2.css", "space/szl-holo-v2.js"]
          asset_paths = []
          for raw in raw_asset_paths:
              path = Path(raw)
              if path.is_absolute() or '\\' in raw or '..' in path.parts:
                  raise SystemExit(f'unsafe declared holographic asset path: {raw}')
              asset_paths.append(path)
          missing_assets = [str(path) for path in asset_paths if not path.is_file()]
          if missing_assets:
              raise SystemExit(f'missing declared holographic assets: {missing_assets}')

          css_files = sorted(path for path in asset_paths if path.suffix.lower() == '.css')
          if not css_files:
              raise SystemExit('missing holographic CSS')
          css_required = (
              'SZL Public Experience v3',
              '--szl-touch-target',
              '100dvh',
              'safe-area-inset',
              'overflow-x: clip',
              'max-width: 479px',
              'min-width: 768px',
              'min-width: 1440px',
              'min-width: 1920px',
              'min-width: 2560px',
              'prefers-reduced-motion',
              'prefers-contrast',
              'forced-colors',
              '@media print',
          )
          for path in css_files:
              text = path.read_text(encoding='utf-8')
              missing = [item for item in css_required if item not in text]
              if missing:
                  raise SystemExit(f'{path}: missing responsive contracts: {missing}')
              prohibited = ('@import', 'cdn.', 'unpkg.', 'jsdelivr.')
              if any(item in text for item in prohibited):
                  raise SystemExit(f'{path}: external runtime asset')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'{path}: unbalanced CSS braces')

          js_files = sorted(path for path in asset_paths if path.suffix.lower() == '.js')
          prohibited_js = (
              'fetch(', 'XMLHttpRequest', 'sendBeacon', 'localStorage',
              'sessionStorage', 'document.cookie',
          )
          for path in js_files:
              text = path.read_text(encoding='utf-8')
              for marker in (
                  '__SZL_PUBLIC_EXPERIENCE_V3__',
                  'szlPublicExperienceV3',
                  'szlViewportTier',
                  'visualViewport',
                  'requestAnimationFrame',
              ):
                  if marker not in text:
                      raise SystemExit(f'{path}: missing {marker}')
              if any(item in text for item in prohibited_js):
                  raise SystemExit(f'{path}: prohibited client behavior')
              subprocess.run(['node', '--check', str(path)], check=True)

          py_files = sorted(
              path for path in Path('.').rglob('*.py')
              if path.name in {
                  'szl_hologram_assets.py',
                  'szl_hologram_streamlit.py',
              } and '.git' not in path.parts
          )
          entrypoint = os.environ.get('SZL_HOLO_ENTRYPOINT', '')
          if entrypoint and entrypoint.endswith('.py'):
              py_files.append(Path(entrypoint))
          for path in dict.fromkeys(py_files):
              py_compile.compile(str(path), doraise=True)

          if entrypoint:
              target = Path(entrypoint)
              if not target.is_file():
                  raise SystemExit(f'missing entrypoint: {entrypoint}')
              text = target.read_text(encoding='utf-8')
              source_markers = (
                  'szl-space-hologram',
                  'SZL Holographic Space Fabric v2',
                  'szl_hologram',
                  'data-szl-holo-space-v2',
              )
              asset_names = tuple(path.name for path in asset_paths)
              if not any(marker in text for marker in (*source_markers, *asset_names)):
                  raise SystemExit(f'{entrypoint}: source binding missing')
          PY
          git diff --check
