name: Sync canonical SZL Atlas to Hugging Face Space

"on":
  push:
    branches: [main]
    paths:
      - Dockerfile
      - server.py
      - atlas_energy.py
      - gateway.py
      - launchpad_views.py
      - demo_adapters.py
      - visitor_views.py
      - demo_data/**
      - requirements-public-demos.txt
      - space/**
      - README.md
      - .github/workflows/hf-sync.yml
  workflow_dispatch: {}

# Canonical per-asset Hub write lock (plan D3): never keyed by event or ref.
concurrency:
  group: hf-write/space/SZLHOLDINGS/szl-command-lab
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  deploy:
    name: Deploy, source-bind, and attest exact Atlas
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@3537cba978d018c7c924ab1f90e18c0f879eb886
    with:
      hf-repo: SZLHOLDINGS/szl-command-lab
      ref: ${{ github.sha }}
      require-default-branch-tip: true
      dockerfile-path: Dockerfile
      include-readme: true
      prune: true
      wait-running: 1200
      source-revision-variable: SZL_GIT_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/","/launchpad","/api/build-info","/api/launchpad","/healthz","/readyz","/api/yarqa"]'
    secrets:
      # Preserve the estate-wide, actively validated publisher precedence. An
      # undefined alias evaluates to an empty string; no credential value is
      # printed, persisted, inherited wholesale, or passed anywhere except the
      # reusable deployer's single declared HF_TOKEN input.
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 || secrets.HF_WRITE_TOKEN || secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN }}
